services:
  api:
    image: ghcr.io/healson/life-journal:api
    build: ./backend
    pull_policy: always
    container_name: life-journal-api
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////data/app.db
    volumes:
      - ./data:/data
    restart: unless-stopped
    expose:
      - "8000"

  web:
    image: ghcr.io/healson/life-journal:web
    build: ./diary-app
    pull_policy: always
    container_name: life-journal-web
    depends_on:
      - api
    restart: unless-stopped
    ports:
      - "8080:80"
