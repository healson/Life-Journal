server {
    listen 80;
    server_name _;

    # CORS 预检（APK 内嵌页面 origin 跨域，带 Authorization/JSON 的请求都先发 OPTIONS）：
    # 直接在 nginx 应答、不进 FastAPI，并让浏览器缓存 1 小时，省掉每轮请求的预检往返
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Max-Age "3600" always;
        add_header Content-Length 0 always;
        return 204;
    }

    # 反向代理到后端 api 服务
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 图片上传：nginx 默认仅允许 1MB，超过会 413 导致"上传失败"
        client_max_body_size 20m;
        # AI 接口为 SSE 流式响应：关闭缓冲、放宽读超时，避免打字机输出被攒包
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 带内容哈希的构建产物：可长期缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 入口每次都回源验证：否则 Android WebView 会长期复用旧 index.html，
    # 导致前端更新后手机端仍加载旧 bundle（浏览器端表现不明显）
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 前端静态资源 + SPA 回退
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}